# Archivo de configuracion para daemon_monitor
# Proyecto Unico - Sistemas Operativos 2 - 2S2026

# Puerto TCP en el que escucha el servidor HTTP y SSE (1-65535)
puerto = 8080

# Intervalo en segundos entre cada recoleccion de metricas (1-60)
intervalo = 2

# Ruta al directorio que contiene los archivos del frontend Dashboard
dashboard = ../Dashboard

# Ruta al archivo de log centralizado donde se consolidan las alertas
log_central = ~/so2_logs/log_centralizado.txt

# Rutas de archivos de log a vigilar separadas por coma (maximo 8)
log_rutas = ~/so2_logs/auth.log, ~/so2_logs/app.log

# Palabras clave a vigilar en los logs separadas por coma (maximo 8)
log_palabras = ERROR, FAIL

# Ruta al directorio vigilado por el sensor de integridad y antivirus
ruta_vigilada = ~/so2_vigilado

# Ruta al archivo JSON con las firmas maliciosas de la blacklist
blacklist = blacklist.json
